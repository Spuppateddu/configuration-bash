# /etc/idle-poweroff.conf — this machine's settings for idle-poweroff.
# Written once on the first install and never overwritten, so it is yours.

# Apply changes with: sudo systemctl restart idle-poweroff.timer
# See what it thinks right now with: b-idle

# Turn it off here rather than masking the timer — this survives a re-install.
#ENABLED=false

# Idle limit for an unlocked desktop, the login window, and a headless box.
#IDLE_MINUTES=60

# Once the screen is LOCKED the human has said they are leaving, so it is shorter.
#LOCKED_MINUTES=10

# Grace period between the warning and the poweroff; any activity cancels it.
#WARN_SECONDS=120

# 1-min load average that counts as busy. Absolute, not per-core: an idle Linux
# box sits near 0.00 whatever its cores. Raise it if background chatter trips it.
#MAX_LOAD=0.5

# Process names that mean "the screen is locked", tried in order.
#LOCKERS="i3lock swaylock xsecurelock slock xtrlock"

# Keep true on anything reached over the network, or a headless box powers off
# underneath an ssh session that is merely quiet.
#BLOCK_ON_LOGIN_SESSIONS=true

# A connected ssh client stops the poweroff outright, however quiet it is: an
# open shell, a long build, an scp or a port forward is someone using the box.
# Set false only on a machine something keeps a permanent ssh link to, which
# would otherwise never turn off.
#BLOCK_ON_SSH=true

# How long the machine stays up after the LAST ssh connection closed. A desktop
# or a login screen counts its idle time in X, which logging out of ssh does not
# touch, so without this the machine can power off a couple of minutes after you
# type `exit`. 0 turns the grace period off.
#SSH_GRACE_MINUTES=10

# Ports to look for ssh connections on. Only used when the sshd listener cannot
# be read out of `ss` — normally the port is found on its own, whatever it is.
#SSH_PORTS=22
